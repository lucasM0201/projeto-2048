<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Cyberpunk - Projeto Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen flex flex-col justify-center items-center">
    
    <div id="tela-inicial" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-900/20 via-black to-black pointer-events-none"></div>
        <div class="z-10 flex flex-col items-center text-center p-6">
            <h1 class="text-6xl md:text-8xl font-black neon-text text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 tracking-wider mb-0 drop-shadow-[0_0_20px_rgba(0,255,255,0.6)]">2048</h1>
            <h2 class="text-3xl md:text-5xl text-fuchsia-500 font-bold uppercase tracking-[0.4em] mb-12 drop-shadow-[0_0_15px_rgba(255,0,255,0.8)] orbitron">Cyberpunk</h2>
            
            <p class="text-gray-400 mb-8 max-w-md text-sm md:text-base">
                Conecte os números movendo as peças. Cuidado com os obstáculos <span class="text-red-500 font-bold">X</span>. Use suas habilidades táticas de forma estratégica.
            </p>

            <button onclick="iniciarInterfaceDoJogo()" class="orbitron relative overflow-hidden group bg-transparent border-2 border-cyan-500 text-cyan-400 text-xl md:text-2xl font-bold py-4 px-12 shadow-[0_0_15px_rgba(0,255,255,0.3),inset_0_0_15px_rgba(0,255,255,0.2)] hover:bg-cyan-400 hover:text-black transition-all duration-300 uppercase tracking-widest cursor-pointer">
                <span class="relative z-10">Iniciar Jogo</span>
                <div class="absolute inset-0 h-full w-0 bg-cyan-400 transition-all duration-300 ease-out group-hover:w-full z-0"></div>
            </button>
        </div>
    </div>

    <div class="game-container px-4 escondido" id="jogo-principal">
        
        <div class="flex justify-between items-start mb-4">
            <div class="flex flex-col gap-1">
                <h1 class="text-3xl md:text-4xl font-black neon-text text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 leading-none">2048</h1>
                
                <select id="seletor-dificuldade" class="mt-2 bg-black border border-cyan-500 text-cyan-400 text-xs py-1 px-2 rounded cursor-pointer">
                    <option value="3">Fácil (Máx 3 X)</option>
                    <option value="4" selected>Médio (Máx 4 X)</option>
                    <option value="5">Difícil (Máx 5 X)</option>
                </select>
            </div>

            <div class="flex gap-2 relative z-20">
                <div class="bg-black border border-cyan-900 px-3 py-1 rounded text-center">
                    <div class="text-[0.6rem] font-bold text-cyan-500 uppercase">Pontos</div>
                    <div class="text-lg font-bold text-cyan-300 neon-text" id="pontuacao-atual">0</div>
                </div>
                <div class="bg-black border border-fuchsia-900 px-3 py-1 rounded text-center">
                    <div class="text-[0.6rem] font-bold text-fuchsia-500 uppercase">Recorde</div>
                    <div class="text-lg font-bold text-fuchsia-300 neon-text" id="pontuacao-recorde">0</div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 gap-2">
            <button id="btn-destruir" onclick="alternarHabilidade('destruir')" class="btn-habilidade flex-1 bg-black border border-red-500 text-red-400 font-bold py-2 rounded text-xs uppercase cursor-pointer">
                💥 Eliminar (<span id="cargas-destruir">3</span>)
            </button>
            <button id="btn-trocar" onclick="alternarHabilidade('trocar')" class="btn-habilidade flex-1 bg-black border border-cyan-500 text-cyan-400 font-bold py-2 rounded text-xs uppercase cursor-pointer">
                🔄 Trocar (<span id="cargas-trocar">3</span>)
            </button>
        </div>

        <div class="flex justify-end mb-2">
            <button onclick="prepararNovoJogo()" class="bg-transparent border border-cyan-500 text-cyan-400 font-bold py-1 px-3 rounded text-xs cursor-pointer hover:bg-cyan-900">
                Reiniciar
            </button>
        </div>

        <div class="game-board" id="container-do-tabuleiro">
            <div class="grid-bg" id="fundo-do-tabuleiro"></div>
            <div class="tiles-layer" id="camada-de-pecas"></div>

            <div id="tela-game-over" class="absolute inset-0 bg-black/95 z-50 rounded-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 border border-red-500">
                <h2 class="text-3xl font-black text-red-500 mb-2 orbitron">FALHA CRÍTICA</h2>
                <p class="text-sm text-red-300 mb-6">Sem movimentos possíveis.</p>
                <button onclick="prepararNovoJogo()" class="orbitron bg-black border border-red-500 text-red-400 font-bold py-2 px-6 rounded cursor-pointer hover:bg-red-900">
                    Reboot Sistema
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
